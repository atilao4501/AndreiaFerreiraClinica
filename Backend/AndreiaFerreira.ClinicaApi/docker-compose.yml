version: "3.4"

services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: Root@123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - internal_network

  andreiaferreiraclinicaapi:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "5245:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge