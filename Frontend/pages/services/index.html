<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- navegação -->
            <aside class="col-12 col-md-3 col-lg-2 bg-light p-4 sidebar">
                <img src="../assets/logo.png" alt="Logo da Clínica" class="logo mb-4">
                <nav>
                    <ul class="nav flex-column">
                        <li class="nav-item mb-2"><a href="../patients/index.html" class="nav-link">Pacientes</a></li>
                        <li class="nav-item mb-2"><a href="../agenda/index.html" class="nav-link">Agenda</a></li>
                        <li class="nav-item"><a href="#" class="nav-link active">Atendimentos</a></li>
                    </ul>
                </nav>
            </aside>

            <!-- área principal -->
            <main class="col-12 col-md-9 col-lg-10 p-4">
                <!-- cabeçalho da página -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
                    <h1 class="page-title">Atendimentos</h1>
                    <div class="d-flex flex-column flex-md-row align-items-center">
                        <button class="btn btn-custom me-md-2 mb-2 mb-md-0">+ Novo Atendimento</button>
                        <input type="text" class="form-control d-inline-block" placeholder="Buscar por nome ou CPF" id="search" style="width: 200px;">
                    </div>
                </div>

                <!-- tabela de atendimentos -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Paciente</th>
                                <th>Sessões</th>
                                <th>Total</th>
                                <th class="text-center">Ações</th> <!-- Centralizando o título "Ações" -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Higor José da Silva</td>
                                <td>
                                    <ul class="list-unstyled">
                                        <li>
                                            <span>Sessão 1</span>
                                            15/10/2024
                                        </li>
                                        <li>
                                            <span>Sessão 2</span>
                                            20/10/2024
                                        </li>
                                        <li>
                                            <span>Sessão 3</span>
                                            23/10/2024
                                        </li>
                                    </ul>
                                </td>
                                <td>3</td>
                                <td class="text-center">
                                    <div class="btn-group-vertical">
                                        <button class="btn btn-sm btn-edit mb-2">Editar</button>
                                        <button class="btn btn-sm btn-danger">Excluir</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>Maria Lima</td>
                                <td>
                                    <ul class="list-unstyled">
                                        <li>
                                            <span>Sessão 1</span>
                                            10/09/2024
                                        </li>
                                        <li>
                                            <span>Sessão 2</span>
                                            20/09/2024
                                        </li>
                                    </ul>
                                </td>
                                <td>2</td>
                                <td class="text-center">
                                    <div class="btn-group-vertical">
                                        <button class="btn btn-sm btn-edit mb-2">Editar</button>
                                        <button class="btn btn-sm btn-danger">Excluir</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
